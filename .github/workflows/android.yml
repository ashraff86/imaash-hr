# Builds the IMAASH HR Android app (a Trusted Web Activity that opens
# https://hr.sentuhanhyder.my/) and publishes the APK on the site at
# /download/IMAASH-HR.apk, together with the Digital Asset Links file that lets
# the app open the site full screen.
#
# The signing key is created fresh on each run and never stored, so no secret
# is needed. A rebuilt APK therefore has a new signature: staff uninstall the
# old app before installing the new one. The site itself updates without any
# rebuild, so this only matters when the app's name or icon changes.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create signing key
        run: |
          PW=$(openssl rand -hex 16)
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias imaash-hr \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" \
            -dname "CN=IMAASH HR, O=IMAASH Bersatu Enterprise, L=Langkawi, C=MY"

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish APK and asset links
        run: |
          FP=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias imaash-hr -storepass "$KEYSTORE_PASSWORD" | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "Certificate SHA-256: $FP"
          mkdir -p download .well-known
          cp android/app/build/outputs/apk/release/app-release.apk download/IMAASH-HR.apk
          python3 - "$FP" <<'PY'
          import json, os, sys
          fp = sys.argv[1].strip()
          path = ".well-known/assetlinks.json"
          data = json.load(open(path)) if os.path.exists(path) else []
          prints = []
          for s in data:
              prints += s.get("target", {}).get("sha256_cert_fingerprints", [])
          if fp not in prints:
              prints.append(fp)
          out = [{
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {"namespace": "android_app", "package_name": "my.sentuhanhyder.hr", "sha256_cert_fingerprints": prints},
          }]
          json.dump(out, open(path, "w"), indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/IMAASH-HR.apk .well-known/assetlinks.json
          git commit -m "Android app build ${{ github.run_number }}"
          git push
