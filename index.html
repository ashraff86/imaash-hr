/* Layout: phone-first staff portal. Red header with greeting, content cards, fixed bottom tab bar (Home, Leave, Claims, Payslips, Profile). Same palette as the owner app. */
:root{
  color-scheme:light;
  --bg:#F4F4F6;--surface:#FFFFFF;--ink:#1E1F26;--muted:#5E6170;--line:#E3E3E9;
  --accent:#B3141E;--accent-dark:#7E0D14;--accent-soft:#FBE7E8;
  --good:#11845B;--good-soft:#DDF4EA;--warn:#8C5A00;--warn-soft:#FFF1CC;--info:#2457C5;--info-soft:#E4ECFC;
  --f:"Century Gothic","CenturyGothic","AppleGothic","Questrial","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);font-weight:500;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.hdr{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 22px}
.hdr .row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.hdr .co{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hdr h1{font-size:21px;margin-top:2px}
.hdr .sp{flex:1}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:99px;overflow:hidden}
.lang button{border:0;background:none;color:#fff;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--accent)}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lift{margin-top:-30px}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:700;font-size:14.5px;cursor:pointer;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.ghost{border:0;background:none;color:var(--accent);padding:4px 0}
.btn:disabled{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;text-align:left}
.qa .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.qa b{font-size:14.5px}
.bal{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bx{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.bx span{font-size:12px;color:var(--muted);font-weight:700}
.bx b{display:block;font-size:22px}
.bx i{font-style:normal;font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700}
.li .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.li .amt{font-weight:700;white-space:nowrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-pending{background:var(--warn-soft);color:var(--warn)}
.p-approved{background:var(--good-soft);color:var(--good)}
.p-paid{background:var(--info-soft);color:var(--info)}
.p-rejected{background:var(--accent-soft);color:var(--accent)}
.p-cancelled{background:#ECECF1;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12.5px;color:var(--muted);font-weight:700}
.f input,.f select,.f textarea{font:16px var(--f);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.err{color:var(--accent);font-size:13.5px;min-height:1.2em}
.ok{color:var(--good);font-size:13.5px}
.info{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.kv{display:flex;flex-direction:column;gap:6px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv div span:last-child{text-align:right;overflow-wrap:anywhere}
.kv .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:5px}
.netbox{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.netbox b{font-size:22px;color:var(--accent)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);background:var(--accent);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}

.sheet{position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .hd h3{font-size:18px}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

.auth{min-height:100vh;display:flex;flex-direction:column}
.auth .hdr{padding-bottom:60px}
.auth main{margin-top:-44px;padding-bottom:30px}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function slipPdf(id){
  var l=L(),p=S.D.pay.find(function(x){return x.id===id;}),s=slipNorm(p.slip),e=S.D.emp,M=meta();
  if(!window.jspdf){toast("PDF");return;}
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),y=18,X=16,W=178;
  function money(n){return (n<0?"-":"")+"RM "+Math.abs(N(n)).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
  doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text(String(M.company||""),X,y);
  doc.setFontSize(13);doc.setTextColor(179,20,30);doc.text(l.payslips.toUpperCase().replace(/S$/,""),X+W,y,{align:"right"});doc.setTextColor(0);
  y+=6;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text([(M.regNo||""),String(M.address||"").replace(/\n/g,", ")].filter(Boolean).join("  |  "),X,y);doc.text(mlabel(id),X+W,y,{align:"right"});
  y+=4;doc.setDrawColor(179,20,30);doc.setLineWidth(.8);doc.line(X,y,X+W,y);y+=8;doc.setFontSize(10);
  var lk=[[l.name,e.name],[l.no,e.no],[l.pos,e.position||"-"],[l.ic,e.ic||"-"]],rk=[[l.epfNo,e.epfNo||"-"],[l.socsoNo,e.socsoNo||"-"],[l.bank,e.bank||"-"],[l.acct,e.acct||"-"]];
  for(var i=0;i<4;i++){doc.setTextColor(100);doc.text(lk[i][0],X,y);doc.text(rk[i][0],X+95,y);doc.setTextColor(0);doc.text(String(lk[i][1]||"-"),X+40,y);doc.text(String(rk[i][1]||"-"),X+135,y);y+=6;}
  y+=4;
  function col(x,title,rows,tot){var yy=y;doc.setFont("helvetica","bold");doc.setTextColor(179,20,30);doc.text(title.toUpperCase(),x,yy);doc.setTextColor(0);yy+=2;doc.setDrawColor(220);doc.setLineWidth(.3);doc.line(x,yy,x+84,yy);yy+=6;doc.setFont("helvetica","normal");
    rows.forEach(function(r){doc.text(String(r[0]),x,yy);doc.text(money(r[1]),x+84,yy,{align:"right"});yy+=6;});doc.line(x,yy-3,x+84,yy-3);doc.setFont("helvetica","bold");doc.text(tot[0],x,yy+2);doc.text(money(tot[1]),x+84,yy+2,{align:"right"});doc.setFont("helvetica","normal");return yy+8;}
  var y1=col(X,l.earn,earnRows(s),[l.gross,s.gross]),y2=col(X+94,l.deduct,dedRows(s),[l.ded,s.ded]);y=Math.max(y1,y2);
  if(s.claims){doc.text(l.claims+" (+)",X,y);doc.text(money(s.claims),X+84,y,{align:"right"});y+=8;}
  doc.setFillColor(251,231,232);doc.rect(X,y,W,14,"F");doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(l.net,X+4,y+9);doc.setTextColor(179,20,30);doc.setFontSize(15);doc.text(money(s.net),X+W-4,y+9.5,{align:"right"});doc.setTextColor(0);y+=24;
  doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text(l.empContrib.toUpperCase(),X,y);y+=7;doc.setFont("helvetica","normal");
  [[l.epf,s.epfEr],[l.socso,s.socsoEr],[l.eis,s.eisEr]].forEach(function(r){doc.text(r[0],X,y);doc.text(money(r[1]),X+84,y,{align:"right"});y+=6;});
  y+=10;doc.setFontSize(8);doc.setTextColor(120);doc.text(l.slipNote,X,y);
  doc.save("Slip-Gaji-"+String(e.name).replace(/\s+/g,"-")+"-"+id+".pdf");}

/* ---------- backend ---------- */
function val(id){var el=document.getElementById(id);return el?el.value.trim():"";}
function errMsg(e){var m=(e&&e.message)||String(e),l=L();if(/fetch|network|Failed/i.test(m))return l.net0;if(/invalid login/i.test(m))return l.wrongPw;if(/not confirmed/i.test(m))return l.notConf;return m;}
function setMsg(m,ok){S.msg=m;S.msgOk=!!ok;var el=document.getElementById("a-msg")||document.getElementById("s-err");if(el){el.textContent=m;el.className=ok?"ok":"err";}}
async function load(){
  var r=await cli.rpc("hr_staff_data");
  if(r.error)throw r.error;
  if(!r.data||r.data.error){S.view="nostaff";render();return;}
  S.D=r.data;["leave","claim","pay"].forEach(function(k){S.D[k]=S.D[k]||[];});S.view="app";render();}
async function boot(){
  if(!window.supabase){app.innerHTML='<div class="loading">'+L().net0+'</div>';return;}
  cli=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"imaash-hr-staff"}});
  cli.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){S.view="recover";S.msg="";render();}});
  try{var s=await cli.auth.getSession();
    if(/type=recovery/.test(location.hash)){S.view="recover";render();return;}
    if(s.data&&s.data.session){await load();return;}}catch(e){}
  S.view="auth";render();}

document.addEventListener("click",async function(ev){
  var b=ev.target.closest("[data-tab],[data-act],[data-lang],[data-lf],[data-py]");if(!b)return;
  var d=b.dataset,l=L();
  if(d.lang){S.lang=d.lang;try{localStorage.setItem("hrs-ui",JSON.stringify({lang:S.lang}));}catch(e){}render();return;}
  if(d.tab){S.tab=d.tab;closeSheet();render();window.scrollTo(0,0);return;}
  if(d.lf){S.lf=d.lf;render();return;}
  if(d.py){S.py=d.py;render();return;}
  var a=d.act;
  if(a==="close")return closeSheet();
  if(a==="mode"){S.authMode=S.authMode==="in"?"up":"in";S.msg="";render();return;}
  if(a==="signin"||a==="signup"){
    var em=val("a-em"),pw=document.getElementById("a-pw").value;if(!em||!pw)return setMsg(l.req);
    if(a==="signup"&&pw.length<8)return setMsg(l.pw2);
    b.disabled=true;setMsg("…",true);
    try{
      var here=location.origin+location.pathname;
      var r=a==="signup"?await cli.auth.signUp({email:em,password:pw,options:{emailRedirectTo:here}}):await cli.auth.signInWithPassword({email:em,password:pw});
      if(r.error)throw r.error;
      if(r.data&&r.data.session){S.msg="";await load();}
      else{S.authMode="in";S.msg=l.checkMail;S.msgOk=true;render();}
    }catch(e){b.disabled=false;setMsg(errMsg(e));}
    return;}
  if(a==="forgot"){var em2=val("a-em");if(!em2)return setMsg(l.email+"?");
    try{var r2=await cli.auth.resetPasswordForEmail(em2,{redirectTo:location.origin+location.pathname});if(r2.error)throw r2.error;setMsg(l.resetSent,true);}catch(e){setMsg(errMsg(e));}return;}
  if(a==="savepw"){var np=document.getElementById("a-np").value;if(np.length<8)return setMsg(l.pw2);
    try{var r3=await cli.auth.updateUser({password:np});if(r3.error)throw r3.error;history.replaceState(null,"",location.pathname);toast(l.pwSaved);S.msg="";await load();}catch(e){setMsg(errMsg(e));}return;}
  if(a==="signout"){await cli.auth.signOut();S.D=null;S.view="auth";S.authMode="in";S.msg="";S.tab="home";render();return;}
  if(a==="refresh"){try{await load();toast("✓");}catch(e){toast(errMsg(e));}return;}
  if(a==="newLeave")return sLeave();
  if(a==="newClaim")return sClaim();
  if(a==="slip")return sSlip(d.id);
  if(a==="pdf")return slipPdf(d.id);
  if(a==="sendLeave"){
    var tp=val("l-type"),f=val("l-from"),to=val("l-to"),half=document.getElementById("l-half").checked,n=workDays(f,to,half),lt=ltype(tp);
    if(!tp||!f||!to||to<f)return setMsg(l.req);
    if(!n)return setMsg(l.badDays);
    if(lt.paid){var bal=entitle(tp)-taken(tp,f.slice(0,4))-taken(tp,f.slice(0,4),"pending");if(n>bal)return setMsg(fmt(l.overBal,{n:bal}));}
    b.disabled=true;
    try{var r4=await cli.rpc("hr_staff_apply_leave",{p_type:tp,p_from:f,p_to:to,p_half:half,p_days:n,p_reason:val("l-reason")});if(r4.error)throw r4.error;closeSheet();toast(l.sent);await load();}
    catch(e){b.disabled=false;setMsg(errMsg(e));}
    return;}
  if(a==="sendClaim"){
    var ct=val("c-type"),cd=val("c-date"),ca=Number(val("c-amt"));
    if(!ct||!cd||!(ca>0))return setMsg(l.req);
    b.disabled=true;
    try{var r5=await cli.rpc("hr_staff_submit_claim",{p_type:ct,p_date:cd,p_amount:ca,p_desc:val("c-desc")});if(r5.error)throw r5.error;closeSheet();toast(l.sent);if(S.tab!=="claim"){S.tab="claim";}await load();}
    catch(e){b.disabled=false;setMsg(errMsg(e));}
    return;}
  if(a==="cancel"){
